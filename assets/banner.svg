<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041217"/>
      <stop offset="50%" stop-color="#09252C"/>
      <stop offset="100%" stop-color="#020B0E"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations for Dynamic Elements */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }

    @keyframes waveDash {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pillSlide {
      0% { transform: translateX(0px); }
      50% { transform: translateX(15px); }
      100% { transform: translateX(0px); }
    }

    /* Applied CSS Classes */
    .bg-shape { animation: pulseGlow 8s infinite ease-in-out; transform-origin: center; }
    .particle-1 { animation: floatParticle 6s infinite ease-in-out; }
    .particle-2 { animation: floatParticle 9s infinite ease-in-out 1.5s; }
    .particle-3 { animation: floatParticle 7.5s infinite ease-in-out 3s; }
    .flow-line { stroke-dasharray: 20 10; animation: waveDash 25s linear infinite; }
    .pill-anim { animation: pillSlide 5s infinite ease-in-out; }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #A7F3D0;
      letter-spacing: 0.2px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #064E3B;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>

  <!-- Grid Pattern overlay -->
  <g opacity="0.08">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M100 0V340 M200 0V340 M300 0V340 M400 0V340 M500 0V340 M600 0V340 M700 0V340 M800 0V340 M900 0V340 M1000 0V340 M1100 0V340" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- DYNAMIC ANIMATED BACKGROUND ELEMENTS (Rendered in Background Layer) -->

  <!-- Glowing Orbs -->
  <circle class="bg-shape" cx="1050" cy="80" r="180" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle class="bg-shape" cx="150" cy="280" r="140" fill="#10B981" opacity="0.15" filter="url(#glow)"/>

  <!-- Animated Sensor Data Flow Lines -->
  <path class="flow-line" d="M -50 220 Q 250 140 500 240 T 1000 180 T 1250 220" stroke="#10B981" stroke-width="2.5" fill="none" opacity="0.4"/>
  <path class="flow-line" d="M -50 260 Q 350 310 650 190 T 1150 250" stroke="#06B6D4" stroke-width="1.8" fill="none" opacity="0.3"/>

  <!-- Floating Carbon Sensor Nodes / Particles -->
  <g class="particle-1">
    <circle cx="920" cy="110" r="6" fill="#34D399" opacity="0.9" filter="url(#glow)"/>
    <line x1="920" y1="110" x2="870" y2="70" stroke="#34D399" stroke-width="1" opacity="0.4"/>
    <rect x="830" y="50" width="80" height="24" rx="12" fill="#064E3B" opacity="0.8"/>
    <text x="870" y="66" class="badge-text" fill="#A7F3D0" text-anchor="middle">MRV API</text>
  </g>

  <g class="particle-2">
    <circle cx="1040" cy="220" r="8" fill="#38BDF8" opacity="0.8" filter="url(#glow)"/>
    <line x1="1040" y1="220" x2="1100" y2="260" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <rect x="1060" y="250" width="95" height="24" rx="12" fill="#0C4A6E" opacity="0.8"/>
    <text x="1107" y="266" class="badge-text" fill="#BAE6FD" text-anchor="middle">CCS IoT</text>
  </g>

  <g class="particle-3">
    <circle cx="780" cy="270" r="5" fill="#A7F3D0" opacity="0.7"/>
    <circle cx="150" cy="90" r="7" fill="#10B981" opacity="0.6"/>
  </g>

  <!-- Metric Graph Visualization Wave (Background decoration) -->
  <g opacity="0.25" class="pill-anim">
    <path d="M 750 290 L 800 250 L 850 270 L 900 210 L 950 230 L 1000 160 L 1050 190 L 1100 130" stroke="#10B981" stroke-width="3" fill="none"/>
    <circle cx="1100" cy="130" r="5" fill="#34D399"/>
  </g>

  <!-- FOREGROUND LAYER (Guaranteed to render ON TOP of all dynamic elements) -->
  <g id="foreground" filter="url(#textShadow)">
    
    <!-- Top Pill / Category Tag -->
    <g transform="translate(60, 48)">
      <rect width="250" height="28" rx="14" fill="url(#emeraldGrad)"/>
      <text x="125" y="18" class="badge-text" text-anchor="middle">🌱 CLIMATE TECH &amp; CCS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="132" class="title-text">
      Awesome Carbon Capture
    </text>
    <text x="60" y="180" class="title-text" fill="#34D399">
      &amp; Emissions Monitoring
    </text>

    <!-- Subtitle -->
    <text x="60" y="224" class="subtitle-text">
      Curated SaaS Platforms, Enterprise MRV Tools &amp; Open-Source Carbon Accounting
    </text>

    <!-- Stat/Feature Badges Row -->
    <g transform="translate(60, 256)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="165" height="32" rx="6" fill="#0F292F" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#A7F3D0">⚡ SaaS &amp; Enterprise</text>

      <!-- Item 2 -->
      <rect x="177" y="0" width="165" height="32" rx="6" fill="#0F292F" stroke="#06B6D4" stroke-width="1"/>
      <text x="189" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#BAE6FD">📊 Open-Source MRV</text>

      <!-- Item 3 -->
      <rect x="354" y="0" width="165" height="32" rx="6" fill="#0F292F" stroke="#34D399" stroke-width="1"/>
      <text x="366" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#D1FAE5">🛡️ ISO 14064 / CBAM</text>
    </g>
  </g>
</svg>
