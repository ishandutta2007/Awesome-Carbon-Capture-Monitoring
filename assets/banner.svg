<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#041217"/><stop offset="50%" stop-color="#09252C"/><stop offset="100%" stop-color="#020B0E"/></linearGradient><linearGradient id="emeraldGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10B981"/><stop offset="50%" stop-color="#059669"/><stop offset="100%" stop-color="#34D399"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".8"/><stop offset="100%" stop-color="#3B82F6" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="textShadow"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".9" stdDeviation="6"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-18px) translateX(12px);opacity:.8}}@keyframes waveDash{0%{stroke-dashoffset:1000}}@keyframes pillSlide{0%{transform:translateX(0)}50%{transform:translateX(15px)}}.bg-shape{animation:pulseGlow 8s infinite ease-in-out;transform-origin:center}.particle-1{animation:floatParticle 6s infinite ease-in-out}.particle-2{animation:floatParticle 9s infinite ease-in-out 1.5s}.particle-3{animation:floatParticle 7.5s infinite ease-in-out 3s}.flow-line{stroke-dasharray:20 10;animation:waveDash 25s linear infinite}.pill-anim{animation:pillSlide 5s infinite ease-in-out}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:18px;fill:#a7f3d0;letter-spacing:.2px}.badge-text{font-weight:600;font-size:12px;fill:#064e3b;letter-spacing:.5px;text-transform:uppercase}</style><rect width="1200" height="340" fill="url(#bgGrad)"/><g opacity=".08"><path stroke="#FFF" stroke-width="1" d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200"/><path stroke="#FFF" stroke-width="1" d="M100 0V340 M200 0V340 M300 0V340 M400 0V340 M500 0V340 M600 0V340 M700 0V340 M800 0V340 M900 0V340 M1000 0V340 M1100 0V340"/></g><circle cx="1050" cy="80" r="180" fill="url(#cyanGrad)" class="bg-shape" filter="url(#glow)"/><circle cx="150" cy="280" r="140" fill="#10B981" class="bg-shape" filter="url(#glow)" opacity=".15"/><path fill="none" stroke="#10B981" stroke-width="2.5" d="M -50 220 Q 250 140 500 240 T 1000 180 T 1250 220" class="flow-line" opacity=".4"/><path fill="none" stroke="#06B6D4" stroke-width="1.8" d="M -50 260 Q 350 310 650 190 T 1150 250" class="flow-line" opacity=".3"/><g class="particle-1"><circle cx="920" cy="110" r="6" fill="#34D399" filter="url(#glow)" opacity=".9"/><line x1="920" x2="870" y1="110" y2="70" stroke="#34D399" stroke-width="1" opacity=".4"/><rect width="80" height="24" x="830" y="50" fill="#064E3B" opacity=".8" rx="12"/><text x="870" y="66" fill="#A7F3D0" class="badge-text" text-anchor="middle">MRV API</text></g><g class="particle-2"><circle cx="1040" cy="220" r="8" fill="#38BDF8" filter="url(#glow)" opacity=".8"/><line x1="1040" x2="1100" y1="220" y2="260" stroke="#38BDF8" stroke-width="1" opacity=".4"/><rect width="95" height="24" x="1060" y="250" fill="#0C4A6E" opacity=".8" rx="12"/><text x="1107" y="266" fill="#BAE6FD" class="badge-text" text-anchor="middle">CCS IoT</text></g><g class="particle-3"><circle cx="780" cy="270" r="5" fill="#A7F3D0" opacity=".7"/><circle cx="150" cy="90" r="7" fill="#10B981" opacity=".6"/></g><g class="pill-anim" opacity=".25"><path fill="none" stroke="#10B981" stroke-width="3" d="M 750 290 L 800 250 L 850 270 L 900 210 L 950 230 L 1000 160 L 1050 190 L 1100 130"/><circle cx="1100" cy="130" r="5" fill="#34D399"/></g><g id="foreground" filter="url(#textShadow)"><g transform="translate(60, 48)"><rect width="250" height="28" fill="url(#emeraldGrad)" rx="14"/><text x="125" y="18" class="badge-text" text-anchor="middle">🌱 CLIMATE TECH &amp; CCS ECOSYSTEM</text></g><text x="60" y="132" class="title-text">Awesome Carbon Capture</text><text x="60" y="180" fill="#34D399" class="title-text">&amp; Emissions Monitoring</text><text x="60" y="224" class="subtitle-text">Curated SaaS Platforms, Enterprise MRV Tools &amp; Open-Source Carbon Accounting</text><g transform="translate(60, 256)"><rect width="165" height="32" x="0" y="0" fill="#0F292F" stroke="#10B981" stroke-width="1" rx="6"/><text x="12" y="20" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ SaaS &amp; Enterprise</text><rect width="165" height="32" x="177" y="0" fill="#0F292F" stroke="#06B6D4" stroke-width="1" rx="6"/><text x="189" y="20" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📊 Open-Source MRV</text><rect width="165" height="32" x="354" y="0" fill="#0F292F" stroke="#34D399" stroke-width="1" rx="6"/><text x="366" y="20" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🛡️ ISO 14064 / CBAM</text></g></g></svg>